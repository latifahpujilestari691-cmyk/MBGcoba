<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ 'Edit' if user else 'Tambah' }} Admin — Admin Petra Cookies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body class="admin-page">
  <div class="sidebar-overlay" onclick="toggleMobileSidebar()"></div>
  <aside class="admin-sidebar">
    <div class="brand">
      <img src="/static/images/logo.png" alt="Logo" />
      <span>Petra Cookies</span>
    </div>
    <nav>
      <a href="/admin/dashboard" class="nav-link"><span class="icon">📊</span> Dashboard</a>
      <a href="/admin/produk" class="nav-link"><span class="icon">🍪</span> Produk</a>
      <a href="/admin/galeri" class="nav-link"><span class="icon">📷</span> Galeri</a>
      <a href="/admin/blog" class="nav-link"><span class="icon">📝</span> Blog</a>
      <a href="/admin/faq" class="nav-link"><span class="icon">❓</span> FAQ</a>
      <a href="/admin/users" class="nav-link active"><span class="icon">👥</span> Admin</a>
    </nav>
    <div class="logout-link">
      <a href="/admin/logout">🚪 Logout</a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <button class="hamburger-btn" onclick="toggleMobileSidebar()">☰</button>
      <h2>{{ 'Edit' if user else 'Tambah' }} Admin</h2>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    <div class="admin-table-wrap">
      <form method="POST" class="admin-form">
        <div class="mb-3">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-control" value="{{ user.username if user else '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" value="{{ user.email if user else '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password {{ '(Kosongkan jika tidak ingin ganti)' if user else '' }}</label>
          <input type="password" name="password" class="form-control" {{ 'required' if not user else '' }}>
        </div>
        <div class="mb-3">
          <label class="form-label">Konfirmasi Password</label>
          <input type="password" name="confirm_password" class="form-control" {{ 'required' if not user else '' }}>
        </div>
        <div class="mt-4">
          <button type="submit" class="btn-save">💾 Simpan</button>
          <a href="/admin/users" class="btn-cancel">Batal</a>
        </div>
      </form>
    </div>
  </main>
  <script src="/static/js/admin-sidebar.js"></script>
</body>
</html>
