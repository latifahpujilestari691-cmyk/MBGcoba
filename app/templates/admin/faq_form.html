<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ 'Edit' if faq else 'Tambah' }} FAQ — Admin Petra Cookies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body class="admin-page">
  <aside class="admin-sidebar">
    <div class="brand"><img src="/static/images/logo.png" alt="Logo" /><span>Petra Cookies</span></div>
    <nav>
      <a href="/admin/dashboard" class="nav-link"><span class="icon">📊</span> Dashboard</a>
      <a href="/admin/produk" class="nav-link"><span class="icon">🍪</span> Produk</a>
      <a href="/admin/galeri" class="nav-link"><span class="icon">📷</span> Galeri</a>
      <a href="/admin/blog" class="nav-link"><span class="icon">📝</span> Blog</a>
      <a href="/admin/faq" class="nav-link active"><span class="icon">❓</span> FAQ</a>
      <a href="/admin/users" class="nav-link"><span class="icon">👥</span> Admin</a>
    </nav>
    <div class="view-website-link">
      <a href="/" target="_blank">👁️ Lihat Website</a>
    </div>
    <div class="logout-link"><a href="/admin/logout">🚪 Logout</a></div>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h2>{{ 'Edit' if faq else 'Tambah' }} FAQ</h2>
      <span class="admin-name">👤 {{ session['admin_name'] }}</span>
    </div>
    <div class="admin-form-wrap">
      <h3>{{ 'Edit' if faq else 'FAQ Baru' }}</h3>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Pertanyaan</label>
          <input type="text" name="question" class="form-control"
                 value="{{ faq.question if faq else '' }}" required />
        </div>
        <div class="mb-3">
          <label class="form-label">Jawaban</label>
          <textarea name="answer" class="form-control" rows="4" required>{{ faq.answer if faq else '' }}</textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Urutan Tampil</label>
          <input type="number" name="sort_order" class="form-control" min="0"
                 value="{{ faq.sort_order if faq else 0 }}" />
        </div>
        {% if faq %}
        <div class="mb-3 form-check">
          <input type="checkbox" name="is_active" class="form-check-input" id="isActive"
                 {{ 'checked' if faq.is_active else '' }} />
          <label class="form-check-label" for="isActive">Aktif</label>
        </div>
        {% endif %}
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn-save">💾 Simpan</button>
          <a href="/admin/faq" class="btn-cancel">Batal</a>
        </div>
      </form>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
