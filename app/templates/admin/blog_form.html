<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ 'Edit' if article else 'Tulis' }} Artikel — Admin Petra Cookies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body class="admin-page">

  <aside class="admin-sidebar">
    <div class="brand">
      <img src="/static/images/logo.png" alt="Logo" />
      <span>Petra Cookies</span>
    </div>
    <nav>
      <a href="/admin/dashboard" class="nav-link"><span class="icon">📊</span> Dashboard</a>
      <a href="/admin/produk" class="nav-link"><span class="icon">🍪</span> Produk</a>
      <a href="/admin/galeri" class="nav-link"><span class="icon">📷</span> Galeri</a>
      <a href="/admin/blog" class="nav-link active"><span class="icon">📝</span> Blog</a>
      <a href="/admin/faq" class="nav-link"><span class="icon">❓</span> FAQ</a>
      <a href="/admin/users" class="nav-link"><span class="icon">👥</span> Admin</a>
    </nav>
    <div class="view-website-link">
      <a href="/" target="_blank">👁️ Lihat Website</a>
    </div>
    <div class="logout-link">
      <a href="/admin/logout">🚪 Logout</a>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h2>{{ 'Edit' if article else 'Tulis' }} Artikel</h2>
      <span class="admin-name">👤 {{ session['admin_name'] }}</span>
    </div>

    <div class="admin-form-wrap" style="max-width:800px;">
      <h3>{{ 'Edit' if article else 'Artikel Baru' }}</h3>
      <form method="POST" enctype="multipart/form-data">

        <div class="mb-3">
          <label class="form-label">Judul Artikel</label>
          <input type="text" name="title" class="form-control"
                 value="{{ article.title if article else '' }}" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Ringkasan (Excerpt)</label>
          <textarea name="excerpt" class="form-control" rows="2">{{ article.excerpt if article else '' }}</textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Isi Artikel</label>
          <textarea name="content" class="form-control" rows="10" required>{{ article.content if article else '' }}</textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Thumbnail (JPG/PNG)</label>
          <input type="file" name="image" class="form-control" accept=".jpg,.jpeg,.png" onchange="previewImage(this)" />
          {% if article and article.image %}
            <img src="/static/images/{{ article.image }}" class="img-preview mt-2" id="preview" />
          {% else %}
            <img id="preview" class="img-preview mt-2" style="display:none;" />
          {% endif %}
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" name="is_published" class="form-check-input" id="isPub"
                 {{ 'checked' if article and article.is_published else '' }} />
          <label class="form-check-label" for="isPub">Terbitkan sekarang</label>
        </div>

        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn-save">💾 Simpan</button>
          <a href="/admin/blog" class="btn-cancel">Batal</a>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/js/admin-form.js"></script>
</body>
</html>
