<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin — Petra Cookies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body class="login-page">

  <div class="login-box">
    <div class="login-logo">
      <img src="/static/images/logo.png" alt="Petra Cookies" />
      <h1>Petra Cookies</h1>
      <p>Panel Admin</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} py-2 text-center">
          {{ message }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" action="/admin/login">
      <div class="mb-3">
        <label class="form-label fw-bold">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Username admin" required autofocus />
      </div>
      <div class="mb-4">
        <label class="form-label fw-bold">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Password" required />
      </div>
      <button type="submit" class="btn-login w-100">Masuk</button>
    </form>

    <div class="text-center mt-3">
      <a href="/" class="back-link">← Kembali ke Website</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
