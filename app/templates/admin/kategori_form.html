<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ 'Edit' if kategori else 'Tambah' }} Kategori — Admin Petra Cookies</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/admin.css" />
</head>
<body class="admin-page">

  <aside class="admin-sidebar">
    <div class="brand">
      <img src="/static/images/logo.png" alt="Logo" />
      <span>Petra Cookies</span>
    </div>
    <nav>
      <a href="/admin/dashboard" class="nav-link"><span class="icon">📊</span> Dashboard</a>
      <a href="/admin/produk" class="nav-link active"><span class="icon">🍪</span> Produk</a>
      <a href="/admin/galeri" class="nav-link"><span class="icon">📷</span> Galeri</a>
      <a href="/admin/blog" class="nav-link"><span class="icon">📝</span> Blog</a>
      <a href="/admin/faq" class="nav-link"><span class="icon">❓</span> FAQ</a>
      <a href="/admin/users" class="nav-link"><span class="icon">👥</span> Admin</a>
    </nav>
    <div class="view-website-link">
      <a href="/" target="_blank">👁️ Lihat Website</a>
    </div>
    <div class="logout-link"><a href="/admin/logout">🚪 Logout</a></div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h2>{{ 'Edit' if kategori else 'Tambah' }} Kategori</h2>
      <span class="admin-name">👤 {{ session['admin_name'] }}</span>
    </div>

    <div class="admin-form-wrap">
      <h3>{{ 'Edit' if kategori else 'Kategori Baru' }}</h3>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Nama Kategori</label>
          <input type="text" name="name" class="form-control"
                 value="{{ kategori.name if kategori else '' }}" required />
        </div>
        <div class="d-flex gap-2 mt-4">
          <button type="submit" class="btn-save">💾 Simpan</button>
          <a href="/admin/kategori" class="btn-cancel">Batal</a>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
